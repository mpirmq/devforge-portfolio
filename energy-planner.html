<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Energy Cost Planner | DEVFORGE</title><style>body{margin:0;background:#090d18;color:#e9f0ff;font:16px system-ui,sans-serif}main{max-width:920px;margin:45px auto;padding:22px}a{color:#8cd9ff}.panel{background:#141c2d;border:1px solid #33415a;border-radius:16px;padding:24px;margin:20px 0}input,select,button,textarea{font:inherit;padding:10px;margin:6px 4px 6px 0;border-radius:8px;border:1px solid #53627b;background:#202c43;color:white}button{background:#2075ad;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:left;border-bottom:1px solid #34415a}.muted{color:#a9b7cc}.result{font-size:24px;font-weight:bold}label{display:inline-block;margin:8px}@media(max-width:650px){input,select,button{max-width:100%;box-sizing:border-box}}</style></head><body><main><a href="index.html#work">← DEVFORGE portfolio</a><h1>Energy Cost Planner</h1><p class="muted">Compare electricity tariffs and efficiency scenarios for European households and small businesses.</p><div class="panel"><label>Annual electricity (kWh)<input id="kwh" type="number" min="0" value="3500"></label><label>Current tariff (€/kWh)<input id="old" type="number" min="0" step="0.01" value="0.35"></label><label>Alternative tariff (€/kWh)<input id="new" type="number" min="0" step="0.01" value="0.27"></label><label>Fixed annual fee (€)<input id="fee" type="number" min="0" value="120"></label><label>Estimated reduction (%)<input id="reduce" type="number" min="0" max="100" value="10"></label><p><button onclick="calculate()">Compare scenarios</button></p><div id="out" aria-live="polite"></div></div><p class="muted">Illustrative calculator, not an energy supplier quote. No data leaves your browser.</p><script>function calculate(){const v=id=>Number(document.getElementById(id).value),vals=['kwh','old','new','fee','reduce'].map(v);if(vals.some(x=>!Number.isFinite(x)||x<0)||vals[4]>100){out.textContent='Enter valid nonnegative values and reduction up to 100%.';return}const [k,o,n,f,r]=vals;const current=k*o+f,alternative=k*(1-r/100)*n+f;const fmt=x=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(x);out.innerHTML='<p>Current estimated annual cost: <strong>'+fmt(current)+'</strong></p><p>Alternative estimated annual cost: <strong>'+fmt(alternative)+'</strong></p><p class="result">Estimated annual saving: '+fmt(current-alternative)+'</p>'}calculate()</script></main></body></html>
