<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSV Data Cleaner | DEVFORGE</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#e9efff;font:16px system-ui,Arial}main{max-width:1000px;margin:32px auto;padding:0 20px}a{color:#75d8ff}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(28px,5vw,46px)}p,.muted{color:#a7b3cc}section,.panel{background:#121a2b;border:1px solid #28344e;border-radius:18px;padding:22px;margin:20px 0}label{display:block;margin:12px 0 5px;color:#b8c5dc}input,textarea,select{width:100%;padding:12px;border:1px solid #465570;background:#0b1220;color:white;border-radius:9px;font:inherit}textarea{min-height:130px}button,.btn{display:inline-block;cursor:pointer;border:0;border-radius:9px;background:#4bc5ec;color:#061321;font-weight:700;padding:12px 18px;margin:8px 8px 8px 0;text-decoration:none}button.secondary{background:#283a57;color:white}button:focus-visible,a:focus-visible{outline:3px solid white}table{border-collapse:collapse;width:100%;margin-top:15px}th,td{text-align:left;padding:10px;border-bottom:1px solid #2c3a54;word-break:break-word}small{color:#a7b3cc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.stat{font-size:30px;font-weight:700}.error{color:#ff9f9f}.success{color:#83e3b2}@media print{body{background:white;color:black}header,.no-print,button{display:none!important}section,.panel{border:0;background:white;color:black}p,.muted,small{color:#333}input{color:black;border:0}}</style></head><body><main><header><strong>DEV<span style="color:#4bc5ec">FORGE</span> / LIVE DEMO</strong><a href="../index.html#work">← Back to portfolio</a></header><h1>CSV Data Cleaner</h1><p>Paste CSV or upload a CSV file, remove duplicate rows, trim whitespace and export cleaned data.</p><section><label for="file">Upload CSV (optional)</label><input id="file" type="file" accept=".csv,text/csv"><label for="csv">CSV content</label><textarea id="csv">Name,Email,City
 Alice ,ALICE@example.com, Berlin 
Bob,bob@example.com,Hamburg
 Alice ,ALICE@example.com, Berlin 
Cara,cara@example.com,Cologne</textarea><div class="no-print"><button id="clean">Clean data</button><button id="download" class="secondary" disabled>Download cleaned CSV</button></div><p id="message" role="status"></p><div class="grid"><div class="panel">Input rows<div class="stat" id="before">—</div></div><div class="panel">Output rows<div class="stat" id="after">—</div></div><div class="panel">Duplicates removed<div class="stat" id="removed">—</div></div></div><div id="preview" style="overflow:auto"></div></section><p class="muted">Interactive browser demo. Your data stays on this device; no server or account is required.</p></main><script>const $=id=>document.getElementById(id);let output='';function parseCSV(s){let rows=[],row=[],cell='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(q)throw Error('Unclosed quoted CSV field');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}function escapeCell(v){return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}function clean(){try{const rows=parseCSV($('csv').value).map(r=>r.map(v=>v.trim()));if(rows.length<2)throw Error('Include a header and at least one data row');let width=rows[0].length;if(rows.some(r=>r.length!==width))throw Error('Rows have different numbers of columns');const seen=new Set(),unique=[];for(const r of rows.slice(1)){const key=JSON.stringify(r.map(v=>v.toLowerCase()));if(!seen.has(key)){seen.add(key);unique.push(r)}}const all=[rows[0],...unique];output=all.map(r=>r.map(escapeCell).join(',')).join('\r\n');$('before').textContent=rows.length-1;$('after').textContent=unique.length;$('removed').textContent=rows.length-1-unique.length;$('preview').replaceChildren();let t=document.createElement('table');all.slice(0,21).forEach((r,i)=>{let tr=t.insertRow();r.forEach(v=>{let c=document.createElement(i?'td':'th');c.textContent=v;tr.append(c)})});$('preview').append(t);$('message').textContent='Cleaned successfully; showing up to 20 rows.';$('message').className='success';$('download').disabled=false}catch(e){$('message').textContent=e.message;$('message').className='error';$('download').disabled=true}}$('file').addEventListener('change',async e=>{let f=e.target.files[0];if(f){if(f.size>2e6){$('message').textContent='Maximum file size: 2 MB';return}$('csv').value=await f.text()}});$('clean').onclick=clean;$('download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([output],{type:'text/csv;charset=utf-8'}));a.download='cleaned-data.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};clean();</script></body></html>
